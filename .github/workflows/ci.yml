name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查（服务端）
        run: cd server && npx tsc --noEmit
      - name: 类型检查（客户端）
        run: cd client && npx tsc --noEmit
      - name: 服务端测试
        run: cd server && npx tsx --test test/auth.test.ts test/docs.test.ts test/engine.test.ts test/features.test.ts test/perf.test.ts test/ws.test.ts
      - name: 客户端测试
        run: cd client && npx tsx --test test/model.test.ts test/utils.test.ts
      - name: 构建
        run: cd client && npx vite build
