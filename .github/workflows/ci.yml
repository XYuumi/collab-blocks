name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查（服务端）
        run: npm run typecheck -w server
      - name: 类型检查（客户端）
        run: npm run typecheck -w client
      - name: 全部测试（50 个）
        run: npm test
      - name: 构建
        run: npm run build
